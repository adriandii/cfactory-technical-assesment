name: cfactory

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: images
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d images"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.6.8-alpine
    # AOF keeps queued jobs across restarts; BullMQ requires noeviction.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  silo:
    # S3-compatible object storage (community MinIO fork). Pinned: the project is young.
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: silo-admin
      MINIO_ROOT_PASSWORD: silo-dev-password
    ports:
      - "127.0.0.1:${SILO_API_PORT:-59000}:9000"
      - "127.0.0.1:${SILO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - silo-data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready", "--quiet"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  silo-data:
