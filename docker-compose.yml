name: cfactory

# The api, worker and setup containers run the same backend image with different commands.
x-backend: &backend
  build: ./backend
  image: cfactory-backend:local
  environment:
    DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@postgres:5432/images
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://silo:9000
    S3_REGION: us-east-1
    S3_BUCKET: images
    S3_ACCESS_KEY_ID: ${SILO_ROOT_USER:-silo-admin}
    S3_SECRET_ACCESS_KEY: ${SILO_ROOT_PASSWORD:-silo-dev-password}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}

services:
  # Entry point: serves the React app and proxies /api to the api service.
  web:
    build: ./web
    image: cfactory-web:local
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Accepts uploads, records jobs, queues them. Never processes images.
  api:
    <<: *backend
    command: ["node", "dist/main/api.js"]
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Takes jobs off the queue and does the image processing. Scale with --scale worker=N.
  worker:
    <<: *backend
    command: ["node", "dist/main/worker.js"]
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # `docker compose stop` lets the job in progress finish; a killed worker's job is redelivered.
    stop_grace_period: 30s
    restart: unless-stopped

  # One-shot: applies database migrations and creates the bucket, then exits.
  setup:
    <<: *backend
    command: ["node", "dist/main/setup.js"]
    depends_on:
      postgres:
        condition: service_healthy
      silo:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: images
    ports:
      # Loopback only, for running the backend outside Docker (see README).
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d images"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:8.6.8-alpine
    # AOF keeps queued jobs across restarts; BullMQ requires noeviction.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  silo:
    # S3-compatible object storage (community MinIO fork). Pinned: the project is young.
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:-silo-admin}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:-silo-dev-password}
    ports:
      - "127.0.0.1:${SILO_API_PORT:-59000}:9000"
      - "127.0.0.1:${SILO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - silo-data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready", "--quiet"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  silo-data:
