server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 20 MB image plus multipart overhead. The API enforces the exact limit and answers with a clear 413.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Re-resolve the api service through Docker's DNS, so a restarted container's new IP is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream uploads straight to the API instead of spooling them to disk first.
        proxy_request_buffering off;
    }

    # Vite puts a content hash in every asset file name, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
